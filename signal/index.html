<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Signal project team registration.">
  <meta name="robots" content="noindex, nofollow">
  <title>Signal — Team registration</title>
  <link rel="canonical" href="https://mehrshadesk.ir/signal/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='white'/%3E%3Cpath d='M8 23h6l4-11 5 17 4-9h5' fill='none' stroke='%23821e3a' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=3">
  <script src="./config.js?v=2" defer></script>
  <script src="./background.js?v=4" defer></script>
  <script src="./app.js?v=3" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="scene-vignette" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Signal registration">signal<span class="brand-dot">.</span></a>
    <a class="home-link" href="https://mehrshadesk.ir/">mehrshadesk.ir</a>
  </header>
  <main>
    <section class="panel" aria-label="Team registration">
      <div id="registration-view">
        <form id="registration" novalidate autocomplete="on">
          <span class="sr-only" id="member-count" aria-live="polite">1 / 3</span>
          <div id="members"></div>
          <button class="add-button" id="add-member" type="button"><span aria-hidden="true">+</span> Add teammate</button>
          <fieldset class="project-fieldset"><legend class="sr-only">Project</legend>
            <div class="projects">
              <label class="project-option"><input type="radio" name="project" value="A" aria-describedby="project-error" required><span class="project-tile"><span>Project A</span><span class="selection-dot" aria-hidden="true"></span></span></label>
              <label class="project-option"><input type="radio" name="project" value="B" aria-describedby="project-error" required><span class="project-tile"><span>Project B</span><span class="selection-dot" aria-hidden="true"></span></span></label>
            </div>
            <p id="project-error" class="field-error" hidden>Select a project.</p>
          </fieldset>
          <div class="bot-field" aria-hidden="true"><label>Website<input name="website" id="website" tabindex="-1" autocomplete="off"></label></div>
          <div id="form-status" class="form-status" role="status" aria-live="polite" tabindex="-1" hidden></div>
          <button class="submit-button" id="submit" type="submit"><span id="submit-label">Register team</span><svg id="submit-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg><span class="spinner" hidden aria-hidden="true"></span></button>
        </form>
      </div>
      <div id="success-view" class="success-view" hidden tabindex="-1">
        <h1>Registered<span>.</span></h1>
        <p id="success-summary"></p><div class="receipt"><span>Registration ID</span><strong id="receipt-id"></strong></div>
      </div>
      <footer class="panel-footer"><a href="https://t.me/mehesk" target="_blank" rel="noopener noreferrer" aria-label="Contact @mehesk on Telegram">@mehesk</a></footer>
    </section>
  </main>
  <noscript><p class="noscript">Enable JavaScript to register your team. Questions? <a href="https://t.me/mehesk">@mehesk</a></p></noscript>
  <template id="member-template">
    <fieldset class="member">
      <legend class="sr-only"><span class="member-name">Member 1</span></legend>
      <button class="remove-button" type="button" hidden aria-label="Remove teammate"><span aria-hidden="true">×</span></button>
      <label class="full-name-field">Full name<input data-field="name" type="text" maxlength="80" autocapitalize="words" spellcheck="false" required><span class="field-error" hidden></span></label>
      <div class="field-row">
        <label>Phone number<input data-field="phone" type="tel" inputmode="tel" maxlength="24" required><span class="field-error" hidden></span></label>
        <label>Student ID<input data-field="studentId" type="text" inputmode="numeric" maxlength="20" spellcheck="false" required><span class="field-error" hidden></span></label>
      </div>
    </fieldset>
  </template>
</body>
</html>

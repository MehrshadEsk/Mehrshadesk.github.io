<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">Wireless communications illustration</title>
  <desc id="d">A light, realistic vector scene of a wireless tower connected to devices and a skyline, with subtle animated signals and moving data points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbfe"/>
      <stop offset="100%" stop-color="#e9f2f8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ecf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#eef5fa" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4e7f4"/>
      <stop offset="100%" stop-color="#c2dced"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42697f"/>
      <stop offset="100%" stop-color="#24485e"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .line{stroke:#78a8c6;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 10;animation:dash 10s linear infinite}
      .line.alt{animation-direction:reverse}
      .pulse{transform-origin:center;animation:pulse 3s ease-in-out infinite}
      .beacon{animation:flicker 3.4s ease-in-out infinite}
      .orbit{opacity:.55;animation:ping 3.8s ease-in-out infinite}
      .orbit.two{animation-delay:1.2s}
      .orbit.three{animation-delay:2.4s}
      .packet{filter:url(#softGlow)}
      .packetA{animation:moveA 6s linear infinite}
      .packetB{animation:moveB 7.2s linear infinite}
      .packetC{animation:moveC 5.6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
      @keyframes flicker{0%,100%{opacity:.75}50%{opacity:1}}
      @keyframes ping{0%{opacity:0;transform:scale(.55)}30%{opacity:.55}100%{opacity:0;transform:scale(1.03)}}
      @keyframes moveA{0%{transform:translate(0,0)}50%{transform:translate(165px,-72px)}100%{transform:translate(332px,-116px)}}
      @keyframes moveB{0%{transform:translate(0,0)}50%{transform:translate(124px,-16px)}100%{transform:translate(248px,-34px)}}
      @keyframes moveC{0%{transform:translate(0,0)}50%{transform:translate(-114px,-7px)}100%{transform:translate(-228px,-24px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <rect x="0" y="0" width="960" height="360" fill="url(#sky)"/>
  <circle cx="802" cy="112" r="42" fill="#fff" opacity="0.65"/>
  <circle cx="158" cy="98" r="26" fill="#fff" opacity="0.55"/>
  <path d="M0 440C110 410 202 420 294 395c120-32 212-90 350-56 120 29 204 15 316-18v239H0Z" fill="url(#hill)"/>

  <g opacity="0.55">
    <rect x="70" y="332" width="28" height="70" fill="#b9d4e5"/>
    <rect x="105" y="308" width="34" height="94" fill="#c6dceb"/>
    <rect x="146" y="288" width="42" height="114" fill="#b7d1e3"/>
    <rect x="194" y="324" width="29" height="78" fill="#c4dbeb"/>
    <rect x="230" y="300" width="38" height="102" fill="#bcd6e7"/>
    <rect x="730" y="318" width="32" height="84" fill="#c6dceb"/>
    <rect x="768" y="280" width="44" height="122" fill="#b7d1e3"/>
    <rect x="820" y="333" width="30" height="69" fill="#c8deed"/>
    <rect x="856" y="301" width="41" height="101" fill="#b9d4e5"/>
  </g>

  <g transform="translate(470 310)">
    <ellipse class="orbit" cx="0" cy="-118" rx="30" ry="30" fill="none" stroke="#5d95b6" stroke-width="2.4"/>
    <ellipse class="orbit two" cx="0" cy="-118" rx="58" ry="58" fill="none" stroke="#7daecc" stroke-width="2.1"/>
    <ellipse class="orbit three" cx="0" cy="-118" rx="86" ry="86" fill="none" stroke="#9ec2da" stroke-width="1.8"/>

    <path d="M-38 160 0 0 38 160" fill="url(#towerGrad)"/>
    <path d="M-22 108H22M-31 72H31M-13 36H13" stroke="#d6e9f5" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0V160" stroke="#d8ebf6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-118" r="13" fill="#31617b" stroke="#dff1fb" stroke-width="3"/>
    <circle class="beacon" cx="0" cy="-118" r="6" fill="#8ed3f2"/>

    <path class="line" d="M0 -118C88 -176 178 -172 272 -120"/>
    <path class="line alt" d="M0 -118C70 -129 143 -120 215 -104"/>
    <path class="line" d="M0 -118C-85 -140 -172 -127 -262 -92"/>

    <g class="pulse">
      <circle cx="272" cy="-120" r="16" fill="#ffffff" stroke="#6da8c7" stroke-width="2.4"/>
      <circle cx="272" cy="-120" r="6" fill="#74c3ea"/>
      <circle cx="215" cy="-104" r="11" fill="#ffffff" stroke="#6da8c7" stroke-width="2.1"/>
      <circle cx="215" cy="-104" r="4" fill="#74c3ea"/>
      <circle cx="-262" cy="-92" r="15" fill="#ffffff" stroke="#6da8c7" stroke-width="2.4"/>
      <circle cx="-262" cy="-92" r="6" fill="#74c3ea"/>
    </g>

    <circle class="packet packetA" cx="0" cy="-118" r="5.2" fill="#79cbef"/>
    <circle class="packet packetB" cx="0" cy="-118" r="4.6" fill="#90d5ef"/>
    <circle class="packet packetC" cx="0" cy="-118" r="4.8" fill="#79cbef"/>
  </g>

  <g transform="translate(180 426)">
    <rect x="-48" y="-20" width="96" height="40" rx="8" fill="#fbfdff" stroke="#b2cfdf"/>
    <rect x="-30" y="-5" width="60" height="10" rx="5" fill="#bfd9e8"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#b7d9eb" stroke-width="1.4" stroke-dasharray="3 8" opacity="0.7"/>
  </g>
  <g transform="translate(760 424)">
    <rect x="-46" y="-18" width="92" height="36" rx="18" fill="#fbfdff" stroke="#b2cfdf"/>
    <circle cx="-20" cy="0" r="7" fill="#9bd2eb"/>
    <rect x="-5" y="-6" width="34" height="12" rx="6" fill="#bfd9e8"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#b7d9eb" stroke-width="1.4" stroke-dasharray="3 8" opacity="0.7"/>
  </g>
</svg>

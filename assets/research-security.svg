<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="600" viewBox="0 0 960 600" role="img"><defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D2031"/><stop offset=".54" stop-color="#162F41"/><stop offset="1" stop-color="#102333"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#258CA5" stop-opacity=".25"/><stop offset="1" stop-color="#258CA5" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49778E" stop-opacity=".18"/><stop offset=".52" stop-color="#72CED5" stop-opacity=".9"/><stop offset="1" stop-color="#49778E" stop-opacity=".35"/></linearGradient>
  <filter id="halo" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" fill="none" stroke="#B6D3DD" stroke-opacity=".055" stroke-width="1"/></pattern>
  <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".95" fill="#8AB4C3" opacity=".12"/></pattern>
  <style>
  .wire{fill:none;stroke:#6193A8;stroke-width:1.7;stroke-opacity:.42;stroke-linecap:round;stroke-linejoin:round}
  .wire-strong{fill:none;stroke:url(#line);stroke-width:2.1;stroke-linecap:round}
  .detail{fill:none;stroke:#8EC2D0;stroke-opacity:.31;stroke-width:1.35}
  .soft{fill:#9AD0DD;opacity:.3}
  .pulse{animation:signal 4.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  .pulse-later{animation-delay:-1.7s}
  .pulse-last{animation-delay:-3.1s}
  .trace{stroke-dasharray:5 14;animation:flow 14s linear infinite}
  .trace-reverse{animation-direction:reverse}
  @keyframes signal {0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes flow {to {stroke-dashoffset:-190}}
  @media(prefers-reduced-motion: reduce){*{animation:none!important} animate,animateMotion {display:none}}
  </style>
</defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">Secure computing illustration</title>
  <desc id="d">A light, realistic vector illustration of a secure processor with animated data flow on a circuit board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbfe"/>
      <stop offset="100%" stop-color="#ebf3f8"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf5fb"/>
      <stop offset="100%" stop-color="#dcebf5"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6278"/>
      <stop offset="100%" stop-color="#274e63"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .trace{fill:none;stroke:#8fb6cc;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 10;animation:dash 12s linear infinite}
      .trace.rev{animation-direction:reverse}
      .packet{filter:url(#glow)}
      .packet1{animation:p1 7s linear infinite}
      .packet2{animation:p2 6s linear infinite}
      .packet3{animation:p3 5.5s linear infinite}
      .packet4{animation:p4 8s linear infinite}
      .chipGlow{animation:soft 3.2s ease-in-out infinite}
      .scan{animation:scan 3.8s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes soft{0%,100%{opacity:.6}50%{opacity:1}}
      @keyframes scan{0%{transform:translateY(-22px);opacity:0}15%{opacity:.45}50%{opacity:.6}85%{opacity:.45}100%{transform:translateY(24px);opacity:0}}
      @keyframes p1{0%{transform:translate(0,0)}100%{transform:translate(198px,-106px)}}
      @keyframes p2{0%{transform:translate(0,0)}100%{transform:translate(-186px,-98px)}}
      @keyframes p3{0%{transform:translate(0,0)}100%{transform:translate(186px,88px)}}
      @keyframes p4{0%{transform:translate(0,0)}100%{transform:translate(-198px,100px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <rect x="80" y="86" width="800" height="428" rx="30" fill="url(#board)" stroke="#d0e1ec"/>

  <g opacity="0.45">
    <circle cx="154" cy="148" r="4.5" fill="#94bcd2"/>
    <circle cx="806" cy="138" r="4.5" fill="#94bcd2"/>
    <circle cx="142" cy="466" r="4.5" fill="#94bcd2"/>
    <circle cx="818" cy="456" r="4.5" fill="#94bcd2"/>
  </g>

  <g transform="translate(480 300)">
    <path class="trace" d="M-212 -128H-128L-84 -84H-24"/>
    <path class="trace rev" d="M212 -128H128L84 -84H24"/>
    <path class="trace" d="M-212 128H-128L-84 84H-24"/>
    <path class="trace rev" d="M212 128H128L84 84H24"/>
    <path class="trace rev" d="M-236 0H-116L-78 0H-24"/>
    <path class="trace" d="M236 0H116L78 0H24"/>

    <circle class="packet packet1" cx="-24" cy="-24" r="5" fill="#82d0ef"/>
    <circle class="packet packet2" cx="24" cy="-24" r="5" fill="#82d0ef"/>
    <circle class="packet packet3" cx="24" cy="24" r="5" fill="#82d0ef"/>
    <circle class="packet packet4" cx="-24" cy="24" r="5" fill="#82d0ef"/>

    <rect x="-112" y="-112" width="224" height="224" rx="24" fill="#f7fbfe" stroke="#bbd3e2" stroke-width="2"/>
    <rect x="-84" y="-84" width="168" height="168" rx="18" fill="url(#chip)" stroke="#5c89a4" stroke-width="2.2"/>
    <rect x="-56" y="-56" width="112" height="112" rx="14" fill="#2e566c" stroke="#9ec7da" stroke-width="1.8"/>

    <g fill="#aecddd">
      <rect x="-145" y="-70" width="33" height="9" rx="4.5"/>
      <rect x="-145" y="-31" width="33" height="9" rx="4.5"/>
      <rect x="-145" y="8" width="33" height="9" rx="4.5"/>
      <rect x="-145" y="47" width="33" height="9" rx="4.5"/>
      <rect x="112" y="-70" width="33" height="9" rx="4.5"/>
      <rect x="112" y="-31" width="33" height="9" rx="4.5"/>
      <rect x="112" y="8" width="33" height="9" rx="4.5"/>
      <rect x="112" y="47" width="33" height="9" rx="4.5"/>
      <rect x="-70" y="-145" width="9" height="33" rx="4.5"/>
      <rect x="-31" y="-145" width="9" height="33" rx="4.5"/>
      <rect x="8" y="-145" width="9" height="33" rx="4.5"/>
      <rect x="47" y="-145" width="9" height="33" rx="4.5"/>
      <rect x="-70" y="112" width="9" height="33" rx="4.5"/>
      <rect x="-31" y="112" width="9" height="33" rx="4.5"/>
      <rect x="8" y="112" width="9" height="33" rx="4.5"/>
      <rect x="47" y="112" width="9" height="33" rx="4.5"/>
    </g>

    <g class="chipGlow">
      <circle cx="0" cy="0" r="73" fill="#6ec9eb" opacity="0.14"/>
      <circle cx="0" cy="0" r="92" fill="#6ec9eb" opacity="0.08"/>
    </g>

    <g transform="translate(0 -4)">
      <path d="M0-28c18 0 33 14 33 32v11H17V4c0-9-7-16-17-16S-17-5-17 4v11h-16V4c0-18 15-32 33-32Z" fill="#d9edf8"/>
      <rect x="-40" y="13" width="80" height="62" rx="12" fill="#e8f5fc" stroke="#a5c8db" stroke-width="2"/>
      <circle cx="0" cy="44" r="7" fill="#5c89a4"/>
      <path d="M0 51v10" stroke="#5c89a4" stroke-width="4" stroke-linecap="round"/>
    </g>

    <rect class="scan" x="-76" y="-78" width="152" height="18" rx="9" fill="#ffffff" opacity="0.18"/>
  </g>

  <g opacity="0.5">
    <path d="M132 180h74M132 420h102M754 183h74M728 421h100" stroke="#b5d1e1" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

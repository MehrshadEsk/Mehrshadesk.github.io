<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#050a08">
  <title>Telegram: @mehesk</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #050a08;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(ellipse at center, #0b2118, #050a08 70%);
    }

    .background::before {
      content: "";
      position: absolute;
      inset: -64px;
      background-image:
        linear-gradient(#60ffab09 1px, transparent 1px),
        linear-gradient(90deg, #60ffab09 1px, transparent 1px);
      background-size: 64px 64px;
      animation: drift 18s linear infinite;
      mask-image: radial-gradient(ellipse, black, transparent 75%);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: -100% 0 0;
      background: linear-gradient(
        transparent 47%,
        #6affac05 49%,
        #6affac12 50%,
        transparent 53%
      );
      animation: scan 10s linear infinite;
    }

    a {
      padding: 24px;
      color: #baffd5;
      font-size: clamp(1.1rem, 4.5vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.035em;
      text-decoration: none;
      white-space: nowrap;
      text-shadow: 0 0 24px #69ffa83b;
      transition: color 200ms, text-shadow 200ms;
    }

    a:hover {
      color: #e6fff0;
      text-shadow: 0 0 30px #69ffa877;
    }

    a:focus-visible {
      outline: 1px solid #8fffb8;
      outline-offset: 8px;
      border-radius: 4px;
    }

    @keyframes drift {
      to { transform: translate(64px, 64px); }
    }

    @keyframes scan {
      from { transform: translateY(-25%); }
      to { transform: translateY(75%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .background::before,
      .background::after { animation: none; }
      a { transition: none; }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <main>
    <a href="https://t.me/mehesk">Telegram: @mehesk</a>
  </main>
</body>
</html>

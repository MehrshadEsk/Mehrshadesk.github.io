<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<meta name="theme-color" content="#000000" />
<title>Apply Vault</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
  }
  #message{
    margin:0;
    text-align:center;
    font-size:clamp(24px,4vw,52px);
    font-weight:500;
    letter-spacing:-0.03em;
    line-height:1.15;
  }
  body[data-auth="checking"] #message{visibility:hidden}
</style>
</head>
<body data-auth="checking">
  <p id="message">you are smart, but I am smarter</p>

<script src="access-config.js"></script>
<script>
(() => {
  'use strict';

  const cfg = window.MEHRSHAD_ACCESS || {};
  const API = String(cfg.apiUrl || '').trim();
  const GATE = cfg.gateUrl || 'apply-vault.html';
  const email = String(sessionStorage.getItem('applicationJourneyEmail') || '').trim().toLowerCase();
  const credential = String(sessionStorage.getItem('applicationJourneyCredential') || '').trim().toLowerCase();
  const authorized = sessionStorage.getItem('applicationJourneyAuthorized') === '1';
  const configured = /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(API);
  const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const validCredential = /^[a-f0-9]{64}$/.test(credential);

  function terminate(){
    sessionStorage.removeItem('applicationJourneyAuthorized');
    sessionStorage.removeItem('applicationJourneyEmail');
    sessionStorage.removeItem('applicationJourneyCredential');
    location.replace(GATE);
  }

  function remoteCheck(){
    return new Promise(resolve => {
      if(!configured){ resolve(null); return; }
      const cb = `vaultRevalidate_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const script = document.createElement('script');
      let finished = false;
      const finish = value => {
        if(finished) return;
        finished = true;
        clearTimeout(timer);
        try{ delete window[cb]; }catch(_){ window[cb] = undefined; }
        script.remove();
        resolve(value);
      };
      const timer = setTimeout(() => finish(null), 7000);
      window[cb] = data => finish(!!(data && data.allowed === true));
      script.onerror = () => finish(null);
      script.src = `${API}?action=verify&email=${encodeURIComponent(email)}&credential=${encodeURIComponent(credential)}&callback=${encodeURIComponent(cb)}&_=${Date.now()}`;
      document.body.appendChild(script);
    });
  }

  async function validate(){
    if(!authorized || !validEmail || !validCredential){ terminate(); return; }

    if(configured){
      try{
        const remote = await remoteCheck();
        if(remote !== true){ terminate(); return; }
      }catch(_){
        terminate();
        return;
      }
    }

    document.body.dataset.auth = 'ok';
  }

  validate();
})();
</script>
</body>
</html>

 document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey || event.target.closest('a,button,input,textarea,select,[contenteditable],.timeline')) return;
  const distance = { ArrowDown: 40, ArrowUp: -40, PageDown: timeline.clientHeight * .85, PageUp: -timeline.clientHeight * .85 };
  if (event.key in distance) { timeline.scrollTop += distance[event.key]; event.preventDefault(); }
  else if (event.key === 'Home' || event.key === 'End') { timeline.scrollTop = event.key === 'Home' ? 0 : timeline.scrollHeight; event.preventDefault(); }
 });
 document.querySelector('.footer a').addEventListener('click', event => {
  event.preventDefault();
  timeline.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
 });
})();
</script>
<script>
 (()=>{
  const group=document.querySelector('.shared-term');
  function connect(){
   const g=group.getBoundingClientRect(), d=group.querySelector('.term-date').getBoundingClientRect();
   const svg=group.querySelector('.term-branches');
   const rail=parseFloat(getComputedStyle(group).getPropertyValue('--rail'));
   svg.setAttribute('viewBox',`0 0 ${g.width} ${g.height}`);
   for(const kind of ['ta','milestone']){
    const target=group.querySelector(kind==='ta'?'.ta-card':'.milestone-text').getBoundingClientRect();
    const y=target.top-g.top+target.height/2;
    const mobile=matchMedia('(max-width:600px)').matches;
    const x=mobile?d.left-g.left:d.right-g.left;
    const startY=mobile?Math.max(d.top-g.top+12,Math.min(y,d.bottom-g.top-12)):y;
    svg.querySelector('.'+kind+'-branch').setAttribute('d',`M ${x} ${startY} H ${rail} V ${y}`);
    const node=svg.querySelector('.'+kind+'-node');node.setAttribute('cx',rail);node.setAttribute('cy',y);
   }
  }
  new ResizeObserver(connect).observe(group);
  document.fonts.ready.then(connect);connect();
 })();
 </script></body>
</html>
